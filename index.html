<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄美食地圖 JS版</title>

<style>
html, body {
  margin: 0;
  height: 100%;
}

#map {
  height: 50vh;
  width: 100%;
}

#list {
  padding: 10px;
  font-family: -apple-system;
}

.card {
  background: #fff;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="list"></div>

<script>

const places = [
{ name:"鹽埕鴨肉意麵", lat:22.6239, lng:120.2840 },
{ name:"阿凡沙茶麻醬麵", lat:22.6245, lng:120.2836 },
{ name:"老蔡虱目魚粥", lat:22.6249, lng:120.2851 },
{ name:"阿財雞絲麵", lat:22.6253, lng:120.2856 },
{ name:"鴨肉本", lat:22.6241, lng:120.2828 }
];

let map;

function initMap() {

map = new google.maps.Map(document.getElementById("map"), {
  center: { lat: 22.6273, lng: 120.3014 },
  zoom: 15
});

// 🔥 全部標記
places.forEach(p => {

  const marker = new google.maps.Marker({
    position: { lat: p.lat, lng: p.lng },
    map: map,
    title: p.name
  });

  const info = new google.maps.InfoWindow({
    content: `<b>${p.name}</b>`
  });

  marker.addListener("click", () => {
    info.open(map, marker);
  });

});

renderList();

}

function renderList() {

document.getElementById("list").innerHTML =
places.map(p => `
<div class="card">
<b>${p.name}</b><br>
<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">
導航
</a>
</div>
`).join("");

}

</script>

<!-- ⚠️ 這裡要換 API KEY -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>

</body>
</html>
